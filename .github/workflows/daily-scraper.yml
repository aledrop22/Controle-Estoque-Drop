name: Daily Scraper

on:
  schedule:
    # Executa todos os dias às 01:00 da manhã (UTC-3)
    - cron: '0 4 * * *'  # 01:00 UTC-3 = 04:00 UTC
  workflow_dispatch:  # Permite execução manual

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          cd scraper
          pip install -r requirements.txt
          playwright install --with-deps chromium
      
      - name: Get authentication cookie
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          cd scraper
          python obter_cookie.py
      
      - name: Run scraper
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: |
          cd scraper
          python scrape_seuarmazemdrop.py
      
      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: update scraped data [skip ci]" || echo "No changes to commit"
          git push
